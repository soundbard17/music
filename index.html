<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Liquid Glass Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    body {
      background-color: #040508;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }
    .heading-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    .liquid-glass {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    .liquid-glass-nav {
      background: rgba(4, 5, 8, 0.85);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .liquid-glass-bottom {
      background: rgba(8, 10, 16, 0.92);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }
    .liquid-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }
    .liquid-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      cursor: pointer;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Ambient Light Glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-32 left-1/4 w-[500px] h-[500px] bg-white/[0.04] rounded-full blur-[140px]"></div>
    <div class="absolute top-1/2 -right-32 w-[600px] h-[600px] bg-slate-500/[0.03] rounded-full blur-[160px]"></div>
  </div>

  <!-- Real Working HTML5 Audio Player -->
  <audio id="real-audio-player" preload="auto"></audio>

  <!-- Top Navbar -->
  <header class="sticky top-0 z-40 w-full liquid-glass-nav">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer">
        <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center border border-white/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
        </div>
        <div>
          <span class="heading-font font-bold text-lg tracking-wider text-white">AURA</span>
          <span class="text-[10px] text-emerald-400 font-semibold block leading-none">● LIVE ENGINE</span>
        </div>
      </div>
      <div class="text-xs text-white/50 border border-white/10 px-3 py-1.5 rounded-full liquid-pill">
        320kbps Lossless CDN
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 pb-36">
    
    <!-- Search Bar -->
    <div class="relative max-w-2xl mx-auto mb-6">
      <div class="relative flex items-center">
        <svg class="w-5 h-5 text-white/40 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search Hindi, Punjabi, International songs..." 
          class="w-full bg-white/[0.05] border border-white/15 rounded-2xl pl-12 pr-12 py-3.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-white/40 transition-all shadow-xl"
        >
        <div id="search-spinner" class="hidden absolute right-4">
          <svg class="animate-spin h-5 w-5 text-white/60" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </div>
      </div>
    </div>

    <!-- Quick Search Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-2 mb-8">
      <button onclick="quickSearch('Kesariya Arijit Singh')" class="liquid-pill px-3 py-1.5 rounded-full text-xs text-white/80">Kesariya</button>
      <button onclick="quickSearch('295 Sidhu Moose Wala')" class="liquid-pill px-3 py-1.5 rounded-full text-xs text-white/80">295 (Sidhu)</button>
      <button onclick="quickSearch('Softly Karan Aujla')" class="liquid-pill px-3 py-1.5 rounded-full text-xs text-white/80">Softly (Karan Aujla)</button>
      <button onclick="quickSearch('Starboy The Weeknd')" class="liquid-pill px-3 py-1.5 rounded-full text-xs text-white/80">Starboy</button>
      <button onclick="quickSearch('Lover Diljit Dosanjh')" class="liquid-pill px-3 py-1.5 rounded-full text-xs text-white/80">Lover (Diljit)</button>
    </div>

    <!-- Section Heading -->
    <div class="flex items-center justify-between mb-4">
      <h2 id="section-title" class="heading-font text-lg font-bold text-white/90">Trending Hits</h2>
      <span id="results-count" class="text-xs text-white/40">Select a song to play</span>
    </div>

    <!-- Song List Grid -->
    <div id="songs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
      <!-- Songs will appear here dynamically -->
    </div>
  </main>

  <!-- Bottom Floating Music Player Bar -->
  <footer class="fixed bottom-0 left-0 right-0 z-50 liquid-glass-bottom px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-col gap-1.5">
      <!-- Progress Bar -->
      <div class="flex items-center gap-2 w-full text-[11px] text-white/50">
        <span id="time-current">0:00</span>
        <input type="range" id="seek-bar" value="0" max="100" class="flex-1 h-1">
        <span id="time-duration">0:00</span>
      </div>

      <!-- Controls & Song Info -->
      <div class="flex items-center justify-between gap-3">
        <!-- Current Song Details -->
        <div class="flex items-center gap-3 overflow-hidden max-w-[55%]">
          <img id="player-img" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120" class="w-11 h-11 rounded-lg object-cover border border-white/10 shrink-0">
          <div class="truncate">
            <h4 id="player-title" class="text-sm font-semibold text-white truncate">Select a song</h4>
            <p id="player-artist" class="text-xs text-white/50 truncate">Live 320kbps stream</p>
          </div>
        </div>

        <!-- Play/Pause Buttons -->
        <div class="flex items-center gap-3 shrink-0">
          <button onclick="playPrev()" class="p-2 text-white/70 hover:text-white transition-all">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
          </button>
          <button id="play-pause-btn" onclick="togglePlay()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition-all shadow-lg">
            <svg id="play-icon" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            <svg id="pause-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
          </button>
          <button onclick="playNext()" class="p-2 text-white/70 hover:text-white transition-all">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Real Audio Engine JavaScript -->
  <script>
    const audio = document.getElementById('real-audio-player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const playerImg = document.getElementById('player-img');
    const playerTitle = document.getElementById('player-title');
    const playerArtist = document.getElementById('player-artist');
    const seekBar = document.getElementById('seek-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const searchInput = document.getElementById('search-input');
    const searchSpinner = document.getElementById('search-spinner');
    const songsGrid = document.getElementById('songs-grid');
    const sectionTitle = document.getElementById('section-title');
    const resultsCount = document.getElementById('results-count');

    let currentPlaylist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let debounceTimer = null;

    // Default Starting Hits
    const initialHits = [
      "Kesariya Arijit Singh",
      "295 Sidhu Moose Wala",
      "Softly Karan Aujla",
      "Starboy The Weeknd",
      "Lover Diljit Dosanjh",
      "Apna Bana Le Arijit Singh"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      fetchMultipleSongs(initialHits);
    });

    // Search API Call
    async function searchSongsFromAPI(query) {
      try {
        searchSpinner.classList.remove('hidden');
        const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}`);
        const json = await res.json();
        searchSpinner.classList.add('hidden');

        if (json.success && json.data && json.data.results) {
          return json.data.results.map(item => ({
            id: item.id,
            title: decodeHTMLEntities(item.name),
            artist: decodeHTMLEntities(item.primaryArtists || item.artists?.primary?.map(a => a.name).join(', ') || 'Unknown'),
            image: item.image && item.image.length ? item.image[item.image.length - 1].link || item.image[0].link : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300',
            audioUrl: getBestAudioUrl(item.downloadUrl)
          })).filter(s => s.audioUrl);
        }
        return [];
      } catch (err) {
        console.error("Search error:", err);
        searchSpinner.classList.add('hidden');
        return [];
      }
    }

    function getBestAudioUrl(downloadUrls) {
      if (!downloadUrls || !downloadUrls.length) return null;
      // Prefer highest quality 320kbps or 160kbps
      return downloadUrls[downloadUrls.length - 1].link || downloadUrls[0].link;
    }

    function decodeHTMLEntities(text) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = text;
      return textarea.value;
    }

    async function fetchMultipleSongs(queries) {
      sectionTitle.innerText = "Trending Hits";
      resultsCount.innerText = "Loading songs...";
      let allResults = [];
      for (const q of queries) {
        const res = await searchSongsFromAPI(q);
        if (res.length > 0) allResults.push(res[0]);
      }
      currentPlaylist = allResults;
      renderSongCards(currentPlaylist);
      resultsCount.innerText = `${currentPlaylist.length} tracks ready`;
    }

    function renderSongCards(songs) {
      songsGrid.innerHTML = '';
      if (!songs || songs.length === 0) {
        songsGrid.innerHTML = `<div class="col-span-full text-center py-10 text-white/40 text-sm">No songs found. Try another search.</div>`;
        return;
      }

      songs.forEach((song, idx) => {
        const card = document.createElement('div');
        card.className = "liquid-glass p-3 rounded-2xl flex items-center justify-between gap-3 cursor-pointer hover:bg-white/[0.08] transition-all group";
        card.onclick = () => playSongAtIndex(idx);

        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <img src="${song.image}" class="w-12 h-12 rounded-xl object-cover border border-white/10 shrink-0">
            <div class="truncate">
              <h4 class="text-sm font-semibold text-white/90 group-hover:text-white truncate">${song.title}</h4>
              <p class="text-xs text-white/50 truncate">${song.artist}</p>
            </div>
          </div>
          <button class="w-9 h-9 rounded-full bg-white/10 group-hover:bg-white group-hover:text-black flex items-center justify-center shrink-0 transition-all">
            <svg class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
          </button>
        `;
        songsGrid.appendChild(card);
      });
    }

    function playSongAtIndex(index) {
      if (!currentPlaylist || index < 0 || index >= currentPlaylist.length) return;
      currentIndex = index;
      const song = currentPlaylist[currentIndex];

      playerTitle.innerText = song.title;
      playerArtist.innerText = song.artist;
      playerImg.src = song.image;

      audio.src = song.audioUrl;
      audio.load();
      audio.play().then(() => {
        isPlaying = true;
        updatePlayIcons();
      }).catch(err => {
        console.error("Playback error:", err);
      });
    }

    function togglePlay() {
      if (!audio.src) {
        if (currentPlaylist.length > 0) playSongAtIndex(0);
        return;
      }
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play().then(() => {
          isPlaying = true;
        });
      }
      updatePlayIcons();
    }

    function playNext() {
      if (currentPlaylist.length === 0) return;
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      playSongAtIndex(currentIndex);
    }

    function playPrev() {
      if (currentPlaylist.length === 0) return;
      currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      playSongAtIndex(currentIndex);
    }

    function updatePlayIcons() {
      if (isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }
    }

    // Audio Timeline updates
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        timeCurrent.innerText = formatTime(audio.currentTime);
        timeDuration.innerText = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      playNext();
    });

    seekBar.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    });

    function formatTime(secs) {
      const min = Math.floor(secs / 60) || 0;
      const sec = Math.floor(secs % 60) || 0;
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Live Debounced Search Listener
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearTimeout(debounceTimer);
      if (!q) return;

      debounceTimer = setTimeout(async () => {
        sectionTitle.innerText = `Search: "${q}"`;
        resultsCount.innerText = "Fetching...";
        const results = await searchSongsFromAPI(q);
        currentPlaylist = results;
        renderSongCards(currentPlaylist);
        resultsCount.innerText = `${results.length} songs found`;
      }, 400);
    });

    function quickSearch(songName) {
      searchInput.value = songName;
      searchInput.dispatchEvent(new Event('input'));
    }
  </script>
</body>
</html>
